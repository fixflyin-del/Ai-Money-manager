name: Build & Release Android APK / AAB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Web Assets & Android Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application and Sync Android Assets
        run: node scripts/build-android.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      -       - name: Setup Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK and AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Rename Artifacts
        run: |
          mkdir -p release-output
          # Find APK
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-output/AI-Money-Manager-v6.1.4.apk
            echo "APK ready at release-output/AI-Money-Manager-v6.1.4.apk"
          fi
          # Find AAB
          AAB_PATH=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" release-output/AI-Money-Manager-v6.1.4.aab
            echo "AAB ready at release-output/AI-Money-Manager-v6.1.4.aab"
          fi

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Money-Manager-v6.1.4-Release-Builds
          path: release-output/

      - name: Create GitHub Release with Direct Download Links
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v6.1.4' }}
          name: AI Money Manager Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v6.1.4' }}
          body: |
            ## Fixfly AI Money Manager v6.1.4 Release
            - Package: `com.aimoneymanager.app`
            - Version Name: `6.1.4`
            - Version Code: `14`
            - Compact horizontal account selection cards with icon and real balance
            - Deep AI Smart Analysis with account-specific burn rate and runway projections
            - Fully working Category Budget Planner with spending velocity and overspending alerts
            - Account-wise financial analysis with strict transfer separation
            - Permanent Firestore persistence & zero undefined field values
            - Official Website & Legal Portal at https://aimoneymanager.pro
            - 100% Free Launch Mode preserved
          files: |
            release-output/AI-Money-Manager-v6.1.4.apk
            release-output/AI-Money-Manager-v6.1.4.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
