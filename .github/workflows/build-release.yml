name: Build & Release Android APK / AAB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Web Assets & Android Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application and Sync Android Assets
        run: node scripts/build-android.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Use the Android SDK already installed on GitHub's Ubuntu runner.
      # Do not use android-actions/setup-android: it requests the removed
      # legacy "tools" package and fails on current Android command-line tools.
      - name: Install Required Android SDK Packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -eu
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the GitHub runner."
            exit 1
          fi
          # sdkmanager exits after consuming all license answers; the yes
          # process may receive SIGPIPE when that happens. Do not let that
          # harmless upstream exit abort the workflow.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK and AAB
        working-directory: android
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Verify APK and AAB Were Created
        run: |
          set -euo pipefail
          test -n "$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"

      - name: Rename Artifacts
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB_PATH="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          cp "$APK_PATH" release-output/AI-Money-Manager-v6.1.4.apk
          cp "$AAB_PATH" release-output/AI-Money-Manager-v6.1.4.aab

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Money-Manager-v6.1.4-Release-Builds
          path: release-output/

      - name: Create GitHub Release with Direct Download Links
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v6.1.4' }}
          name: AI Money Manager Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v6.1.4' }}
          body: |
            ## Fixfly AI Money Manager v6.1.4 Release
            - Package: `com.aimoneymanager.app`
            - Version Name: `6.1.4`
            - Version Code: `14`
            - 100% Free Launch Mode preserved
          files: |
            release-output/AI-Money-Manager-v6.1.4.apk
            release-output/AI-Money-Manager-v6.1.4.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
