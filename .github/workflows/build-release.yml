name: Build & Release Android APK / AAB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Signing Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application and Sync Android Assets
        run: node scripts/build-android.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Required Android SDK Packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -eu
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the GitHub runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Upload Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/aimoney-upload-key.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Signed Release APK and AAB
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease --stacktrace \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify APK and AAB Signatures
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB_PATH="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$APK_PATH"
          test -n "$AAB_PATH"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          jarsigner -verify -verbose -certs "$AAB_PATH"
          keytool -printcert -jarfile "$AAB_PATH"

      - name: Rename Verified Artifacts
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB_PATH="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          cp "$APK_PATH" release-output/AI-Money-Manager-v6.1.5-signed.apk
          cp "$AAB_PATH" release-output/AI-Money-Manager-v6.1.5-signed.aab

      - name: Upload Verified APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: AI-Money-Manager-v6.1.5-SIGNED-Release-Builds
          path: release-output/

      - name: Create GitHub Release with Signed Downloads
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v6.1.5' }}
          name: AI Money Manager Release v6.1.5 (Signed)
          body: |
            ## Fixfly AI Money Manager v6.1.5
            - Package: `com.aimoneymanager.app`
            - Version Name: `6.1.5`
            - Version Code: `15`
            - Signed APK and AAB; signature verification required to pass.
            - 100% Free Launch Mode preserved.
          files: |
            release-output/AI-Money-Manager-v6.1.5-signed.apk
            release-output/AI-Money-Manager-v6.1.5-signed.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
